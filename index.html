<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MarketFinder</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    main {
      max-width: 480px;
      min-height: 100vh;
      margin: 0 auto;
      padding: 24px 16px 40px;
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      color: #1769e0;
    }

    .subtitle {
      margin: 8px 0 24px;
      color: #64748b;
    }

    .card {
      margin-bottom: 16px;
      padding: 18px;
      border-radius: 18px;
      background: white;
      box-shadow: 0 5px 20px rgba(23, 32, 51, 0.08);
    }

    .map {
      position: relative;
      height: 400px;
      overflow: hidden;
      border: 3px solid #d9e1ee;
      border-radius: 16px;
      background: #eef2f7;
    }

    .zone {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 5px;
      border-radius: 8px;
      box-sizing: border-box;
      background: #dbeafe;
      color: #173f76;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .highlight {
      background: #ffb14e;
      color: #593300;
      outline: 3px solid #1769e0;
    }

    .entrance {
      background: #bbf7d0;
      color: #14532d;
    }

    .checkout {
      background: #dbe1eb;
      color: #334155;
    }

    .route {
      position: absolute;
      left: 48%;
      bottom: 26px;
      width: 4px;
      height: 300px;
      border-radius: 4px;
      background: #1769e0;
      transform: rotate(25deg);
      transform-origin: bottom;
    }

    .route-label {
      display: inline-block;
      margin-bottom: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: #dbeafe;
      color: #1769e0;
      font-size: 13px;
      font-weight: bold;
    }

    .next-stop {
      margin: 4px 0;
      font-size: 22px;
    }

    .products {
      margin: 0;
      color: #64748b;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1056ba;
    }
  </style>
</head>
<body>
  <main>
    <h1>MarketFinder</h1>
    <p class="subtitle">Demo-Markt · Deine Einkaufsroute</p>

    <section class="card">
      <div class="map" aria-label="Vereinfachte Marktkarte">
        <div class="zone entrance" style="left: 41%; bottom: 1%; width: 20%; height: 10%;">Eingang</div>
        <div class="zone checkout" style="left: 2%; bottom: 1%; width: 25%; height: 10%;">Kasse</div>

        <div class="zone highlight" style="left: 60%; bottom: 13%; width: 28%; height: 12%;">Brot &amp; Brotzubehör</div>
        <div class="zone" style="right: 2%; top: 10%; width: 18%; height: 59%;">Kühlung</div>
        <div class="zone" style="right: 2%; top: 2%; width: 18%; height: 7%;">Getränke</div>
        <div class="zone" style="right: 21%; top: 2%; width: 18%; height: 7%;">Fleisch</div>
        <div class="zone" style="left: 2%; top: 2%; width: 18%; height: 11%;">Obst &amp; Gemüse</div>
        <div class="zone" style="left: 2%; top: 16%; width: 18%; height: 53%;">Tiefkühlung</div>

        <div class="zone" style="left: 26%; top: 12%; width: 15%; height: 18%;">Kaffee &amp; Müsli</div>
        <div class="zone" style="left: 44%; top: 12%; width: 15%; height: 18%;">Nudeln</div>
        <div class="zone" style="left: 26%; top: 34%; width: 15%; height: 18%;">Konserven</div>
        <div class="zone" style="left: 44%; top: 34%; width: 15%; height: 18%;">Soßen</div>
        <div class="zone" style="left: 26%; top: 56%; width: 15%; height: 18%;">Süßes</div>
        <div class="zone" style="left: 44%; top: 56%; width: 15%; height: 18%;">Wein</div>

        <div class="route"></div>
      </div>
    </section>

    <section class="card">
      <span class="route-label">Nächster Stopp</span>
      <h2 class="next-stop">Brot &amp; Brotzubehör</h2>
      <p class="products">Körnerbrot · Tortillas</p>
 <button onclick="nextStop()">Stopp erledigt</button>
    </section>
  </main>
<script>
  const stops = [
    {
      area: "Brot & Brotzubehör",
      products: "Körnerbrot · Tortillas"
    },
    {
      area: "Nudeln",
      products: "Spaghetti · Tomatensoße"
    },
    {
      area: "Obst & Gemüse",
      products: "Äpfel"
    },
    {
      area: "Kühlregal",
      products: "H-Milch 1,5 %"
    },
    {
      area: "Getränke & Pfandrückgabe",
      products: "Pfand abgeben"
    },
    {
      area: "Tiefkühlprodukte",
      products: "Pizza"
    },
    {
      area: "Kasse",
      products: "Einkauf abschließen"
    }
  ];

  let currentStop = 0;

  function nextStop() {
    currentStop++;

    if (currentStop >= stops.length) {
      document.querySelector(".next-stop").textContent = "Einkauf abgeschlossen";
      document.querySelector(".products").textContent = "Deine Route endet an der Kasse.";
      document.querySelector("button").textContent = "Fertig";
      return;
    }

    document.querySelector(".next-stop").textContent = stops[currentStop].area;
    document.querySelector(".products").textContent = stops[currentStop].products;
  }
</script></body>
</html>
